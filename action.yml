name: "klaws compliance scan"
description: "Scan a codebase for possible Korean compliance risks and emit SARIF for GitHub code scanning."
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "File or directory to scan."
    required: false
    default: "."
  pattern:
    description: "File glob pattern to scan."
    required: false
    default: "*.java"
  output:
    description: "Path to write the SARIF report to."
    required: false
    default: "klaws.sarif"
  fail-on:
    description: "Fail the step if any finding is at or above this severity (none, MEDIUM, HIGH)."
    required: false
    default: "none"
  version:
    description: "klaws release tag to run (e.g. v0.1.5), or 'latest' for the newest release."
    required: false
    default: "latest"

outputs:
  sarif:
    description: "Path to the generated SARIF file."
    value: ${{ inputs.output }}

runs:
  using: "composite"
  steps:
    - name: Run klaws
      shell: bash
      env:
        KLAWS_VERSION: ${{ inputs.version }}
        KLAWS_PATH: ${{ inputs.path }}
        KLAWS_PATTERN: ${{ inputs.pattern }}
        KLAWS_OUTPUT: ${{ inputs.output }}
        KLAWS_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        repo="rostradamus/klaws"

        # Resolve the release tag. For "latest", follow the releases/latest
        # redirect (no API token or jq needed) to the concrete tag.
        tag="$KLAWS_VERSION"
        if [ "$tag" = "latest" ]; then
          tag="$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            "https://github.com/${repo}/releases/latest" | sed 's#.*/tag/##')"
        fi
        # Tolerate a version passed without the conventional leading "v".
        case "$tag" in v*) ;; *) tag="v${tag}" ;; esac
        ver="${tag#v}"

        # Map the runner to goreleaser's archive naming.
        case "$RUNNER_OS" in
          Linux)   os=linux ;;
          macOS)   os=darwin ;;
          Windows) os=windows ;;
          *) echo "klaws: unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "klaws: unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        # Download and extract the prebuilt binary (no Go toolchain needed).
        tmp="$(mktemp -d)"
        base="https://github.com/${repo}/releases/download/${tag}"
        if [ "$os" = "windows" ]; then
          curl -fsSL -o "${tmp}/klaws.zip" "${base}/klaws_${ver}_${os}_${arch}.zip"
          unzip -q "${tmp}/klaws.zip" -d "$tmp"
          bin="${tmp}/klaws.exe"
        else
          curl -fsSL -o "${tmp}/klaws.tgz" "${base}/klaws_${ver}_${os}_${arch}.tar.gz"
          tar -xzf "${tmp}/klaws.tgz" -C "$tmp" klaws
          bin="${tmp}/klaws"
        fi
        chmod +x "$bin" 2>/dev/null || true

        "$bin" scan "$KLAWS_PATH" \
          --pattern "$KLAWS_PATTERN" \
          --format sarif \
          --fail-on "$KLAWS_FAIL_ON" \
          > "$KLAWS_OUTPUT"
